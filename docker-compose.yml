# Compose defaults the project name to the directory basename ("repo"), so
# every scenario run from this checkout shares the container name
# "repo-worker-1": two overlapping runs fail with "container name is already
# in use" (the loser's worker never starts, so all of its probes read curl
# 000) and one run's teardown removes the other's worker mid-walk. Keying the
# project on the scenario's PORT gives each run a private container while the
# service stays exactly `worker` (PRD delivery requirement 2); with PORT unset
# the project is todos-api-3000 and the mapping below stays 127.0.0.1:3000.
name: "todos-api-${PORT:-3000}"
services:
  worker:
    image: node:22-alpine
    working_dir: /app
    # The scenario assigns the worker its port through PORT (PRD.md Product:
    # "listens on PORT from the environment"). Interpolate that port into both
    # the container process and the published host mapping: a hardcoded 3000
    # here left every scenario probe connecting to a port nothing served
    # (curl status 000) even though the process was healthy on 3000, because
    # the published host port did not follow the assignment. The 3000 fallback
    # keeps `docker compose up` working with no PORT in the environment.
    environment:
      PORT: "${PORT:-3000}"
    volumes:
      - .:/app
    command: node server.js
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
